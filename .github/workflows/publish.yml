name: Publish to NuGet

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # Required for GitHub OIDC token generation

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and pack (Release)
        run: dotnet pack src/TorchSharpVisual/TorchSharpVisual.csproj -c Release

      - name: Authenticate with NuGet via OIDC (Trusted Publishing)
        uses: NuGet/login@v1
        with:
          user: JacobGoodchild

      - name: Push to NuGet
        run: dotnet nuget push src/TorchSharpVisual/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate
